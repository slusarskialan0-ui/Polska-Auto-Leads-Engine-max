app = "polska-auto-leads-engine"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1
  auto_start_machines = true
  auto_stop_machines = "off"

[env]
  API_HOST = "0.0.0.0"
  PORT = "8000"

[deploy]
  strategy = "rolling"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
