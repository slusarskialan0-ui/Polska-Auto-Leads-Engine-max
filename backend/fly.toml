app = "polska-auto-leads-engine"
primary_region = "waw"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # auto_heal + auto_restart are driven by this health check and restart limit.
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 3
