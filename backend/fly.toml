app = "polska-auto-leads-engine"
primary_region = "ams"
min_machines_running = 1

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_restart = true
  auto_heal = true

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[env]
  API_HOST = "0.0.0.0"
  PORT = "8000"
