app = "polska-auto-leads-backend"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "./entrypoint.sh"

[env]
  PORT = "8000"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["app"]
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 1

  [services.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[deploy]
  strategy = "rolling"

[experimental]
  auto_rollback = true
