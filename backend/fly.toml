# Set app to your Fly app name or rely on --app in CI deploy.
app = "REPLACE_WITH_FLY_BACKEND_APP_NAME"
primary_region = "waw"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  PORT = "8000"

[processes]
  app = "python main.py"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

  [services.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"
    protocol = "http"

[metrics]
  port = 8000
  path = "/metrics"
